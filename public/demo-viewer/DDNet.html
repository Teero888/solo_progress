<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<script src="../coi-serviceworker.js"></script>
	<style>
		body {
			background: #ccc;
			font-family: sans-serif;
		}

		body,
		html,
		#canvas,
		#output {
			margin: 0;
			width: 100%;
			height: 100%;
		}

		#canvas {
			position: absolute;
			top: 0px;
			left: 0px;
			border: 0;
			overflow: hidden;
			display: block;
		}

		#output {
			display: none;
			padding: 10px;
			overflow: hidden scroll;
			box-sizing: border-box;
			position: absolute;
			bottom: 0;
			left: 0;
			width: 100%;
			height: 200px;
			background: rgba(0, 0, 0, 0.8);
			color: #eee;
			font-family: monospace;
			font-size: 12px;
			z-index: 20;
		}

		#loading-container {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: #0f172a;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			z-index: 100;
			color: white;
			transition: opacity 0.3s ease-in-out;
		}

		.loader-logo {
			margin-bottom: 2rem;
			animation: pulse 2s infinite ease-in-out;
		}

		.progress-wrapper {
			width: 300px;
			height: 6px;
			background: rgba(255, 255, 255, 0.1);
			border-radius: 3px;
			overflow: hidden;
			margin-bottom: 1rem;
		}

		#progress-bar {
			width: 0%;
			height: 100%;
			background: #3b82f6;
			transition: width 0.3s ease;
			box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
		}

		#status-text {
			font-size: 0.85rem;
			color: #94a3b8;
			font-weight: 500;
		}

		@keyframes pulse {
			0% { opacity: 0.6; transform: scale(0.98); }
			50% { opacity: 1; transform: scale(1); }
			100% { opacity: 0.6; transform: scale(0.98); }
		}

		#output .line {
			border-left: 5px solid;
			padding-left: 10px;
		}
	</style>
</head>

<body>
	<div id="loading-container">
		<div class="loader-logo">
			<svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
				<path d="M2 17L12 22L22 17" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
				<path d="M2 12L12 17L22 12" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
			</svg>
		</div>
		<div class="progress-wrapper">
			<div id="progress-bar"></div>
		</div>
		<div id="status-text">Loading engine...</div>
	</div>
	<div id="output"></div>
	<div id="canvas-container"
		style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden;">
		<canvas id="canvas" style="pointer-events: none;">Canvas not supported.</canvas>
		<div id="input-overlay"
			style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: default;"></div>
	</div>
	<script>
		var moduleIsReady = false;
		var demoIsLoaded = false;
		var pendingDemoMessage = null;

		window.addEventListener('keydown', function (e) {
			if (e.key === 'Escape' || e.keyCode === 27) {
				e.stopImmediatePropagation();
				if (!e.repeat) window.parent.postMessage({ type: 'closeDemoViewer' }, '*');
				e.preventDefault();
			} else if (e.key === ' ' || e.keyCode === 32) {
				e.stopImmediatePropagation();
				if (!e.repeat) window.parent.postMessage({ type: 'togglePause' }, '*');
				e.preventDefault();
			} else if (e.key === 'ArrowLeft' || e.keyCode === 37) {
				e.stopImmediatePropagation();
				window.parent.postMessage({ type: 'skip', direction: -1 }, '*');
				e.preventDefault();
			} else if (e.key === 'ArrowRight' || e.keyCode === 39) {
				e.stopImmediatePropagation();
				window.parent.postMessage({ type: 'skip', direction: 1 }, '*');
				e.preventDefault();
			} else if (e.key === 'ArrowUp' || e.keyCode === 38) {
				e.stopImmediatePropagation();
				window.parent.postMessage({ type: 'changeSpeed', direction: 1 }, '*');
				e.preventDefault();
			} else if (e.key === 'ArrowDown' || e.keyCode === 40) {
				e.stopImmediatePropagation();
				window.parent.postMessage({ type: 'changeSpeed', direction: -1 }, '*');
				e.preventDefault();
			}
		}, true);

		window.addEventListener('keyup', e => {
			const handledKeys = ['Escape', ' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];
			if (handledKeys.includes(e.key) || [27, 32, 37, 38, 39, 40].includes(e.keyCode)) {
				e.stopImmediatePropagation();
				e.preventDefault();
			}
		}, true);
		window.addEventListener('keypress', e => {
			const handledKeys = ['Escape', ' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];
			if (handledKeys.includes(e.key) || [27, 32, 37, 38, 39, 40].includes(e.keyCode)) {
				e.stopImmediatePropagation();
				e.preventDefault();
			}
		}, true);

		const inputOverlay = document.getElementById('input-overlay');

		inputOverlay.addEventListener('mousedown', () => {
			window.focus();
			window.parent.postMessage({ type: 'canvasClick' }, '*');
		});

		inputOverlay.addEventListener('touchstart', (e) => {
			window.focus();
			window.parent.postMessage({ type: 'canvasClick' }, '*');
		}, { passive: true });

		inputOverlay.addEventListener('mousemove', () => {
			window.parent.postMessage({ type: 'canvasMove' }, '*');
		});

		inputOverlay.addEventListener('touchmove', () => {
			window.parent.postMessage({ type: 'canvasMove' }, '*');
		}, { passive: true });

		async function doPlayDemo(demoUrl, demoName) {
			try {
				window.focus();
				const loader = document.getElementById('loading-container');
				const statusText = document.getElementById('status-text');
				if (loader) {
					loader.style.display = 'flex';
					loader.style.opacity = '1';
				}
				if (statusText) statusText.textContent = 'Fetching demo...';
				
				const response = await fetch(demoUrl);
				if (!response.ok) throw new Error('Failed to fetch demo');
				const buffer = await response.arrayBuffer();
				const data = new Uint8Array(buffer);
				FS.writeFile(`/${demoName}`, data);
				Module.ccall('EmscriptenCallbackDropFile', null, ['string'], [`/${demoName}`]);
			} catch (e) {
				console.error(e);
				alert("Failed to load demo: " + e.message);
				window.parent.postMessage({ type: 'closeDemoViewer' }, '*');
			}
		}

		window.addEventListener('message', async (event) => {
			if (event.data && event.data.type === 'playDemo') {
				if (moduleIsReady) {
					doPlayDemo(event.data.demoUrl, event.data.demoName);
				} else {
					pendingDemoMessage = event.data;
				}
			} else if (event.data && event.data.type === 'stopDemo') {
				if (moduleIsReady) Module.ccall('EmscriptenDemoStop', null, [], []);
			} else if (event.data && event.data.type === 'pauseDemo') {
				if (moduleIsReady) Module.ccall('EmscriptenDemoPause', null, ['number'], [event.data.pause ? 1 : 0]);
			} else if (event.data && event.data.type === 'setDemoSpeed') {
				if (moduleIsReady) Module.ccall('EmscriptenDemoSetSpeed', null, ['number'], [event.data.speed]);
			} else if (event.data && event.data.type === 'setDemoPos') {
				if (moduleIsReady) Module.ccall('EmscriptenDemoSetPos', null, ['number'], [event.data.tick]);
			} else if (event.data && event.data.type === 'resumeAudio') {
				if (typeof SDL2 !== 'undefined' && SDL2.audioContext) {
					SDL2.audioContext.resume();
				}
				if (typeof AL !== 'undefined' && AL.currentContext && AL.currentContext.audioCtx) {
					AL.currentContext.audioCtx.resume();
				}
			}
		});

		let lastPoll = 0;
		function pollDemoState(timestamp) {
			if (moduleIsReady && timestamp - lastPoll > 100) {
				lastPoll = timestamp;
				
				// Check if demo is loaded if it wasn't already
				if (!demoIsLoaded && Module._EmscriptenDemoIsLoaded && Module.ccall('EmscriptenDemoIsLoaded', 'number', [], []) === 1) {
					demoIsLoaded = true;
					window.parent.postMessage({ type: 'demoLoaded' }, '*');
					
					const loader = document.getElementById('loading-container');
					if (loader) {
						loader.style.opacity = '0';
						setTimeout(() => {
							loader.style.display = 'none';
						}, 300);
					}
				}

				if (Module._EmscriptenDemoGetCurrentTick) {
					try {
						const currentTick = Module.ccall('EmscriptenDemoGetCurrentTick', 'number', [], []);
						if (currentTick >= 0) { // Only send state if a demo is actually playing
							const isPaused = Module.ccall('EmscriptenDemoIsPaused', 'number', [], []);
							const speed = Module.ccall('EmscriptenDemoGetSpeed', 'number', [], []);
							const firstTick = Module.ccall('EmscriptenDemoGetFirstTick', 'number', [], []);
							const lastTick = Module.ccall('EmscriptenDemoGetLastTick', 'number', [], []);

							window.parent.postMessage({
								type: 'demoState',
								state: { isPaused, speed, firstTick, currentTick, lastTick }
							}, '*');
						}
					} catch (e) { }
				}
			}
			requestAnimationFrame(pollDemoState);
		}
		requestAnimationFrame(pollDemoState);

		var output = document.getElementById('output');
		function appendOutput(message, bold, textColor, borderColor) {
			const span = document.createElement("span");
			span.textContent = message;
			span.className = "line";
			if (textColor) {
				span.style.color = textColor;
			}
			if (borderColor) {
				span.style.borderColor = borderColor;
			}
			if (bold) {
				span.style.fontWeight = "bold";
			}
			output.appendChild(span);
			output.appendChild(document.createElement("br"));
			output.scrollTop = output.scrollHeight;
		}
		function parseAnsiColorRgb(line) {
			// Only handles RGB format because our logging system only uses that.
			const match = line.match(/^\x1b\[38;2;(\d+);(\d+);(\d+)m([\s\S]*?)\x1b\[0m$/);
			if (!match) {
				return { color: "black", message: line };
			}
			const [, r, g, b, message] = match;
			return { color: `rgb(${r}, ${g}, ${b})`, message: message };
		}
		var Module = {
			onRuntimeInitialized: function () {
				moduleIsReady = true;
				window.parent.postMessage({ type: 'engineReady' }, '*');
				const progressBar = document.getElementById('progress-bar');
				const statusText = document.getElementById('status-text');
				
				if (progressBar) progressBar.style.width = '100%';
				if (statusText) statusText.textContent = 'Engine ready, loading demo...';
				
				if (pendingDemoMessage) {
					doPlayDemo(pendingDemoMessage.demoUrl, pendingDemoMessage.demoName);
					pendingDemoMessage = null;
				}
			},
			setStatus: function (text) {
				if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
				if (text === Module.setStatus.last.text) return;
				
				const m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
				const now = Date.now();
				const progressBar = document.getElementById('progress-bar');
				const statusText = document.getElementById('status-text');

				if (m) {
					text = m[1];
					if (progressBar) {
						const percentage = (parseInt(m[2]) / parseInt(m[4])) * 100;
						progressBar.style.width = percentage + '%';
					}
				}
				
				if (statusText) {
					statusText.textContent = text || 'Ready';
				}

				if (text) appendOutput("Status: " + text, false, "blue");
			},
			onAbort: function (what) {
				appendOutput("WASM Aborted: " + what, true, "red");
			},
			print: function (text) {
				const parsedLine = parseAnsiColorRgb(text);
				console.log(parsedLine.message);
				appendOutput(parsedLine.message, false, undefined, parsedLine.color);
			},
			printErr: function (text) {
				console.error(text);
				appendOutput(text, false, "red");
			},
			onExit: function () {
				// After client quits, hide the canvas and reset the cursor, as the canvas
				// will be entirely black, also blocking the view of the console output.
				Module['canvas'].style.display = "none";
				// Make sure to reset cursor because it sometimes does not become visible.
				Module['canvas'].style.cursor = "default";
				appendOutput("Client closed. Reload the page to restart.", true);
				const restartButton = document.createElement("button");
				restartButton.textContent = "Reload page";
				restartButton.style.marginTop = "10px";
				restartButton.style.padding = "5px";
				restartButton.addEventListener('click', e => location.reload());
				output.appendChild(restartButton);
				output.scrollTop = output.scrollHeight;
			},
			canvas: document.getElementById('canvas'),
			keyboardListeningElement: window
		};
		window.onerror = function (text) {
			appendOutput(text, true, "red");
		};

		inputOverlay.addEventListener('contextmenu', e => e.preventDefault());
		Module['canvas'].addEventListener('webglcontextcreationerror', e => {
			appendOutput(`Failed to create WebGL context: ${e.statusMessage || "Unknown error"}`, true, "red");
		});
		Module['canvas'].addEventListener('webglcontextlost', e => {
			// The client cannot currently recover from GL context loss, because it
			// would require reloading all textures, framebuffers etc.
			appendOutput(`The WebGL context was lost: ${e.statusMessage || "Unknown error"}`, true, "red");
			Module.ccall('EmscriptenCallbackQuit', null, [], []);
		});
		Module['canvas'].addEventListener('dragover', e => {
			e.preventDefault();
			e.dataTransfer.dropEffect = "none";
			if (!e.dataTransfer.items) {
				return;
			}
			for (const item of e.dataTransfer.items) {
				if (item.kind == 'file' || item.kind == 'string') {
					e.dataTransfer.dropEffect = "copy";
					return;
				}
			}
		});
		Module['canvas'].addEventListener('drop', async e => {
			e.preventDefault();
			if (!e.dataTransfer.items) {
				return;
			}
			var dropFile = null;
			var dropPath = null;
			var dropLink = null;
			for (const item of e.dataTransfer.items) {
				if (item.kind == 'file') {
					const file = item.getAsFile();
					const isDemo = file.name.endsWith(".demo");
					const isMap = file.name.endsWith(".map");
					const homePath = "/home/web_user/.local/share/ddnet"
					var path;
					if (isDemo) {
						path = `${homePath}/demos`
					} else if (isMap) {
						path = `${homePath}/maps`
					} else {
						continue;
					}
					if (dropLink != null) {
						alert("You cannot drop files and links at the same time.");
						break;
					}
					if (dropFile != null) {
						alert("You cannot open multiple files at the same time. Only the first file will be opened.");
						break;
					}
					dropFile = file;
					dropPath = path;
				} else if (item.kind == 'string') {
					const string = e.dataTransfer.getData(item.type);
					if (string.startsWith('ddnet://')) {
						if (dropFile != null) {
							alert("You cannot drop files and links at the same time.");
							break;
						}
						if (dropLink != null && dropLink != string) {
							alert("You cannot connect to multiple URLs at the same time. You will be connected to the first URL.");
							break;
						}
						dropLink = string;
					}
				}
			}
			if (dropFile != null) {
				const buffer = await dropFile.arrayBuffer();
				const data = new Uint8Array(buffer);
				FS.createPath(dropPath, "upload", true, true);
				FS.writeFile(`${dropPath}/upload/${dropFile.name}`, data);
				Module.ccall('EmscriptenCallbackDropFile', null, ['string'], [`${dropPath}/upload/${dropFile.name}`]);
			} else if (dropLink != null) {
				Module.ccall('EmscriptenCallbackDropFile', null, ['string'], [dropLink]);
			} else {
				alert("The items you dropped are not supported. You can drop .demo and .map files, as well as ddnet:// links.");
			}
		});
	</script>
	<script src="DDNet.js"></script>
</body>

</html>
